install:
  claude-code: /plugin install superpowers@claude-plugins-official
  codex: codex plugin marketplace add obra/superpowers, then codex plugin add superpowers@superpowers
  notes: Check the upstream README for the current marketplace names before installing.
overlap: Plan mode and the review commands in both hosts cover part of it. It also contains verification-before-completion, test-driven-development, and a systematic-debugging skill.
related: [verification-before-completion, test-driven-development]
