schemaVersion: 2
id: superpowers
type: plugin
title: Superpowers
summary: An opinionated end-to-end development method packaged as interlocking skills for brainstorming, planning, subagent execution with review, TDD, debugging, verification, git worktrees, and finishing a branch. It ships manifests for Claude Code, Codex, Cursor, and other hosts.
useWhen: A team wants a complete, enforced spec-to-merge workflow rather than individual techniques.
tags: [methodology, planning, tdd, debugging, code-review, verification, subagents, worktrees]
hosts: [claude-code, codex]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    cognitiveEase: 1
    control: 1
    adoption: 2
    compatibility: 2
    upkeep: 2
  context: "Developers working on this task: A team wants a complete, enforced spec-to-merge workflow rather than individual techniques. Declared hosts: claude-code, codex."
  baseline: "Comparison baseline and alternatives: Plan mode and the review commands in both hosts cover part of it. It also contains verification-before-completion, test-driven-development, and a systematic-debugging skill."
  review: docs/reviews/2026-10-29-superpowers.md
  unknowns:
    - Audit bootstrap, skill bodies, hooks and optional companion; README workflow claims do not establish behavioral dependability.
  blockers:
    - scope: Mandatory delete-before-tests workflow
      reason: The pinned README explicitly describes deleting code written before tests. Preserve user work and existing authorization instead of adopting that instruction.
  evidence: reviewed
  reviewed: 2026-10-29
  notes: High process cost; document-specific deletion and compulsory routing rules need revision before broad use. Static curator assessment; no new behavioral trial.
