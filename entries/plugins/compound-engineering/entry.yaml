  license: MIT
  author: Every (Kieran Klaassen, Trevin Chow)
install:
  claude-code: /plugin marketplace add EveryInc/compound-engineering-plugin, then /plugin install compound-engineering
  codex: codex plugin marketplace add EveryInc/compound-engineering-plugin, then codex plugin add compound-engineering@compound-engineering-plugin
  notes: List the hooks and commands the plugin enables before installing it.
overlap: Lesson capture overlaps the retrospective skill. Planning and review overlap host plan mode and review commands.
related: [self-improvement-loop, retrospective, explore-plan-implement-review]
