id: context7
type: mcp
title: Context7 library docs
summary: Fetches version-specific documentation and code examples for libraries by name, through a remote MCP server or a ctx7 CLI with a skill, so agents stop using outdated APIs.
useWhen: Agents write code against fast-moving libraries and keep using deprecated or invented APIs.
tags: [documentation, libraries, api-accuracy]
hosts: [any]
