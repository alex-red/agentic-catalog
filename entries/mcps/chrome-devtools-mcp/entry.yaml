schemaVersion: 2
id: chrome-devtools-mcp
type: mcp
title: Chrome DevTools MCP
summary: The Chrome team's MCP server, which drives Chrome through DevTools to navigate, click, take screenshots, read the console and network activity, and record performance traces, so agents can verify and debug web changes.
useWhen: Agents change web UI and need to see the result, read console or network errors, or diagnose performance, especially in Codex or headless setups.
tags: [dev-ux, browser, verification, debugging, performance]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    cognitiveEase: 3
    control: 2
    adoption: 3
    compatibility: 3
    upkeep: 2
  context: "Developers working on this task: Agents change web UI and need to see the result, read console or network errors, or diagnose performance, especially in Codex or headless setups. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: Claude Code's Chrome integration and built-in browser pane; Playwright MCP is an alternative, so install one of them."
  review: docs/reviews/2026-10-29-chrome-devtools-mcp.md
  unknowns:
    - Inspect runtime/tool contracts and isolation, telemetry and CrUX controls; no browser server was installed or exercised.
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Useful browser diagnostics; explicitly review data collection, profile isolation and overlap with installed tools. Static curator assessment; no new behavioral trial.
