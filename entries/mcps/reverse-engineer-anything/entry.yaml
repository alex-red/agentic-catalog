install:
  any: "Fetch https://github.com/morluto/rea at c0c3902207d6b1a33709e42b80c7e570da7db964 into a trusted tool directory outside the analysis target. Review lifecycle scripts, notices and selected provider dependencies, then follow pinned docs/installation.md for a source build: npm ci and npm run build:cached. Use its documented Node.js version and record the resolved environment. Register an absolute Node executable with arguments /absolute/path/to/rea/scripts/rea.mjs and mcp in project-scoped host configuration. Copy the complete authored .agents/skills/reverse-engineer-anything subtree and references only if its guidance is selected, retaining LICENSE and notices. Native work requires a separately selected compatible provider. Do not run rea setup, install engines, hooks, plugin bundles or AgentEnv/Docker implicitly; a selected published release needs a separately recorded pin and capability check."
  notes: Admission activates nothing. Preserve project conventions and existing permissions. Runtime execution, hardware interaction, database writes and optional companions require the scope of the actual task. Source review only; see docs/reverse-engineering-options.md and the admission record for limits.
overlap: Ordinary source analysis belongs to repo-research. reverse-engineering supplies a smaller method; ReVa and IDA MCP expose particular databases; Cerberus specializes in Apple static/runtime correlation. REA adds cross-format routing, retained evidence and feature investigation at greater operational cost.
