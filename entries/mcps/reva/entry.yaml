install:
  any: "Fetch https://github.com/cyberkaida/reverse-engineering-assistant at a2fcd946ec9c0bcf204da308365c16abb781dc53. Use the pinned README installation route: build the extension against the existing Ghidra with GHIDRA_INSTALL_DIR and gradle install, or select a matching release after separately recording its source/version. Enable the extension in the chosen project and Code Browser only when requested. For a running local GUI, register the project-scoped HTTP MCP endpoint http://localhost:8080/mcp/message in the host configuration. Headless use additionally requires the pinned Python CLI and PyGhidra setup. Ghidra 12.0+ is documented; 12.2+ requires Java 25, earlier supported versions Java 21. Keep the server local and retain normal tool approvals. Optional ReVa/skills/binary-triage and deep-analysis must be separately selected with complete resources and licenses; do not install the entire marketplace implicitly."
  notes: Admission activates nothing. Preserve project conventions and existing permissions. Runtime execution, hardware interaction, database writes and optional companions require the scope of the actual task. Source review only; see docs/reverse-engineering-options.md and the admission record for limits.
overlap: Ghidra already supplies analysis and scripting; host tools supply planning and file inspection. This bridge adds incremental live database access. reverse-engineering can use exported text; REA provides broader artifact coordination and official IDA MCP is an alternative backend.
