title: ReVa Ghidra investigation
summary: Ghidra MCP integration for triage, focused code navigation and iterative database refinement, with optional binary-triage and deep-analysis skills. Known inference-example defects and incomplete runtime review remain disclosed.
useWhen: Investigating compiled behavior in a Ghidra project where repeated cross-reference queries, annotations and type refinement justify a live integration.
