schemaVersion: 2
id: process-compose-mcp
type: mcp
title: Process-compose dev stack control
summary: Process-compose's built-in MCP server. It lets agents list, start, stop and restart a project's processes, read their ports and readiness, and tail or search their logs, all against one shared running instance instead of duplicate background servers.
useWhen: A project's dev stack runs under process-compose and agents keep starting duplicate servers, losing background logs, or guessing whether a service is ready.
tags: [dev-ux, dev-servers, logging, observability]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    cognitiveEase: 2
    control: 2
    adoption: 2
    compatibility: 3
    upkeep: 2
  context: "Developers working on this task: A project's dev stack runs under process-compose and agents keep starting duplicate servers, losing background logs, or guessing whether a service is ready. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: Host background shells (Claude Code run_in_background, Monitor, task lists) run commands within one session; this persists one named stack across sessions and agents, with readiness and searchable logs. portless gives the same apps stable URLs. Third-party process-compose MCP wrappers are superseded by this built-in server."
  review: docs/reviews/2026-10-29-process-compose-mcp.md
  unknowns:
    - Audit transport/control code and argument escaping; the previously recorded shell interpolation defect remains unresolved.
  blockers:
    - scope: Shell-interpolated process tool arguments
      reason: Earlier pinned-source review records injectable quoted placeholders in the documented psql example. Do not expose untrusted arguments through that recipe until escaping is verified and corrected.
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Useful stack management with retained command-interpolation and transport concerns. Static curator assessment; no new behavioral trial.
