schemaVersion: 2
id: process-compose-mcp
type: mcp
title: Process-compose dev stack control
summary: Process-compose's built-in MCP server. It lets agents list, start, stop and restart a project's processes, read their ports and readiness, and tail or search their logs, all against one shared running instance instead of duplicate background servers.
useWhen: A project's dev stack runs under process-compose and agents keep starting duplicate servers, losing background logs, or guessing whether a service is ready.
tags: [dev-ux, dev-servers, logging, observability]
hosts: [any]
rating:
  usefulness: 4
  quality: 4
  portability: 3
  novelty: 4
  evidence: reviewed
  reviewed: 2026-10-29
  notes: MCP server, transports, argument handling and SSE security reviewed at the pin. Nothing is exposed without an mcp_server block; control tools need expose_control_tools. SSE attaches to the running instance; stdio starts a separate copy of the whole project and exits on a port 8080 clash unless --no-server is passed. Process-as-tool substitutes @{arg} into shell commands, and a placeholder inside quotes, as in the docs' psql example, allows injection. SSE without PC_API_TOKEN is open to any local process. No agent outcome trial.
source:
  kind: linked
  url: https://github.com/F1bonacc1/process-compose
  path: src/mcp
  revision: 6ffa74f462cd2fa4f8dc1ee63c70b793b298c858
  retrieved: 2026-10-29
  license: Apache-2.0
  author: Eugene Berger (F1bonacc1)
  notes: The pin is the July 2026 SSE trust-boundary fix (GHSA-5gm3-9crp-6g3v), the last change to src/mcp and its docs. Repository HEAD at review was f471d83a5dfa4779d589d0a73182b6d6e22736b2 (v1.124.0).
install:
  any: 'Add to process-compose.yaml: mcp_server with host: localhost and a port (for example 3000). Add expose_control_tools: true only if agents should start, stop, restart or scale processes. Set PC_API_TOKEN (or --token-file) so other local processes cannot drive it. Start process-compose yourself, then connect clients to that instance.'
  claude-code: claude mcp add --transport sse process-compose http://localhost:3000/sse
  codex: 'Codex is unverified against this legacy SSE server and may need an SSE bridge. The stdio alternative (codex mcp add process-compose -- process-compose -f /absolute/path/process-compose.yaml --no-server) runs a dedicated copy of the project, not the one you started.'
  notes: Avoid quoting @{arg} placeholders inside command templates, and keep processes exposed as tools disabled by default, as upstream advises. Log output is bounded by log_length and returned in chunks, not streamed.
overlap: Host background shells (Claude Code run_in_background, Monitor, task lists) run commands within one session; this persists one named stack across sessions and agents, with readiness and searchable logs. portless gives the same apps stable URLs. Third-party process-compose MCP wrappers are superseded by this built-in server.
related: [portless, mise-mcp, webapp-testing, chrome-devtools-mcp]
