    control: 4
    adoption: 4
    compatibility: 4
    upkeep: 4
  context: "Developers needing explicit authorization boundaries in project instructions, especially with thinner host guidance."
  baseline: "Current host authorization and scope instructions, recorded in overlap; existing project instructions may already suffice."
