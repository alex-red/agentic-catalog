id: scope-and-authority
type: rule
title: Scope and authority
summary: Work toward the requested outcome within the authorization already given, preserve unrelated work, and ask only when the answer changes the result or more authorization is needed.
useWhen: You want an explicit, host-neutral statement of authorization boundaries in AGENTS.md.
