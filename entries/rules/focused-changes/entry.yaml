    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 4
    compatibility: 4
    upkeep: 4
  context: "Developers seeing repeated over-reaching agent diffs; existing project patterns and commands remain authoritative."
  baseline: "Current Claude Code/Codex scope guidance, recorded in overlap; use an explicit project-specific instruction if it suffices."
  review: docs/reviews/2026-10-29-human-v1-starter.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: "Source review only: small, actionable guidance with low setup cost. Incremental value is limited by host overlap; choose it for observed overreach. No new behavioral trial or matched outcome evidence."
