schemaVersion: 2
id: karpathy-coding-guidelines
type: rule
title: Karpathy-style coding guidelines
summary: A widely shared CLAUDE.md with four principles drawn from Andrej Karpathy's observations of LLM coding failures. Surface assumptions, write minimal code, make surgical diffs, and execute toward a goal with verification steps.
useWhen: You want a recognized, drop-in baseline against over-engineering and drive-by edits.
tags: [scope, simplicity, diff-size, assumptions]
hosts: [any]
rating:
  usefulness: 4
  quality: 4
  portability: 5
  novelty: 2
  evidence: reviewed
  reviewed: 2026-10-20
  notes: Very popular, short (about 65 lines), and concrete ("every changed line should trace to the request"). Host system prompts already push most of it, and it overlaps focused-changes. Linked, not vendored, because the repository declares MIT but ships no license file.
