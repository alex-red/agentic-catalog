schemaVersion: 2
id: case-insensitive-guard
type: hook
title: Catch filesystem case collisions
summary: Checks destructive shell targets against real directory entries to catch content versus Content collisions on case-insensitive volumes.
useWhen: Agents delete or overwrite similarly capitalized paths on macOS, Windows, or shared case-insensitive drives.
