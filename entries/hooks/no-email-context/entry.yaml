schemaVersion: 2
id: no-email-context
type: hook
title: Remove account email from initial context
summary: A Claude Code mod that removes the named userEmail block from initial model-visible context while preserving other blocks. Packaged upstream as a small plugin.
useWhen: You want Claude Code's injected account-email context removed before a new conversation reaches the model.
tags:
  - privacy
  - context
  - session-start
hosts:
  - claude-code
rating:
  usefulness: 4
  quality: 4
  portability: 1
  novelty: 5
  evidence: reviewed
  reviewed: 2026-10-28
  notes: Complete MIT source and two tests read. Claude Code 2.1.301 static validation passes with a missing-author warning; no final-request or privacy outcome test. User-installed prompt.context mods are skipped under organization management unless deployed through managed settings.
source:
  kind: linked
  url: https://github.com/AlexErrant/claude-code-no-email
  path: .claude/skills/no-email
  revision: 930d0b2cfabdc41feffb9f15ef0e981259d1e856
  retrieved: 2026-10-28
  license: MIT
  author: AlexErrant
  notes: All seven tracked repository files read. The plugin root is the nested directory, not the repo root; there is no SKILL.md. Runtime uses only the mod API; development types are generated by the host.
install:
  claude-code: Obtain AlexErrant/claude-code-no-email at 930d0b2cfabdc41feffb9f15ef0e981259d1e856 and retain the root LICENSE. The plugin root is .claude/skills/no-email. Validate that directory with claude plugin validate; use claude --plugin-dir /absolute/path/to/.claude/skills/no-email for a session-local trial, or register that directory through a local marketplace. Terminal mods require Claude Code 2.1.287+; validate against the installed build. Start a fresh conversation and verify the final request with synthetic identity data. Organization-managed deployments need managed installation.
  notes: "Removes only the exact userEmail context block, which published types place with the first user message. Does not scrub files, Git identity, tool results, existing histories or logs. Default mod error fallback can preserve unfiltered context; other middleware may reinsert it. No runtime filesystem/network calls in the handler. Harness review: no documented Codex prompt.context/block-removal equivalent; keep Claude-only. Do not substitute a prompt reminder for removing model-visible data."
overlap: Native context transformation supplies the mechanism, but no equivalent account-email setting was verified. prompt-secret-check handles newly submitted credential-like text; secret-serialization concerns application data models.
related:
  - prompt-secret-check
  - secret-serialization
