schemaVersion: 2
id: post-edit-diagnostics
type: hook
title: Run fast diagnostics after source edits
summary: Runs one project-selected fast checker after Claude source edits or Codex apply_patch edits, using a deadline and bounded feedback. Does not install tools or undo edits.
useWhen: Type errors or lint diagnostics should reach the agent immediately after source edits, and the project has a fast read-only check.
tags:
  - dev-ux
  - diagnostics
  - verification
  - post-tool-use
hosts:
  - claude-code
  - codex
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 3
    cognitiveEase: 3
    control: 3
    adoption: 3
    compatibility: 3
    upkeep: 3
  context: "Developers working on this task: Type errors or lint diagnostics should reach the agent immediately after source edits, and the project has a fast read-only check. Declared hosts: claude-code, codex."
  baseline: "Comparison baseline and alternatives: format-after-edit normalizes style; this reports diagnostics without fixing files. stop-gate-checks checks completion. Avoid duplicate expensive checks across both gates."
  review: docs/reviews/2026-10-29-post-edit-diagnostics.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Choose a genuinely fast checker; exit-2 feedback after an edit must not be mistaken for rollback. Static curator assessment; no new behavioral trial.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
  notes: Independent implementation of the cited pattern; no upstream code copied. Host behavior is not established by local script checks.
inspiredBy:
  - title: Anthropic automation recommendations
    url: https://github.com/anthropics/claude-plugins-official/blob/f8c5e7a1dcb71b10cb74586224b5401f3de5db28/plugins/claude-code-setup/skills/claude-automation-recommender/references/hooks-patterns.md
  - title: Official Codex hooks contract
    url: https://learn.chatgpt.com/docs/hooks
install:
  claude-code: Read HOOK.md, copy this entry's runtime files into .claude/hooks/post-edit-diagnostics/, and merge settings.example.json into the project's .claude/settings.json. Review the command and its effects before enabling; preserve existing hooks.
  notes: Project-local opt-in. Running the generated setup command registers this hook; the handler is not executed during setup.
  codex: Read HOOK.md. In a trusted local Git project, copy this entry's runtime files into .codex/hooks/post-edit-diagnostics/ and merge codex-hooks.example.json into .codex/hooks.json without replacing existing handlers. Review and trust the exact definition in /hooks. The example resolves its script from the Git root; do not copy Claude's args or onFailure fields into Codex. Project-local installation only; no activation is performed by the catalog.
overlap: format-after-edit normalizes style; this reports diagnostics without fixing files. stop-gate-checks checks completion. Avoid duplicate expensive checks across both gates.
related:
  - format-after-edit
  - stop-gate-checks
