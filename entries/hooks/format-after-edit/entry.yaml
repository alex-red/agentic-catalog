schemaVersion: 2
id: format-after-edit
type: hook
title: Format after agent edits
summary: A PostToolUse formatter for explicit edited paths in Claude Code and Codex, including newly added apply_patch files. Uses argument arrays instead of whitespace-splitting xargs and avoids unrelated dirty files.
useWhen: The project has a formatter, and agents leave style drift or spend turns fixing formatting.
tags:
  - formatting
  - post-tool-use
hosts:
  - claude-code
  - codex
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 3
    cognitiveEase: 3
    control: 3
    adoption: 3
    compatibility: 3
    upkeep: 3
  context: "Developers working on this task: The project has a formatter, and agents leave style drift or spend turns fixing formatting. Declared hosts: claude-code, codex."
  baseline: "Comparison baseline and alternatives: Editor save hooks and pre-commit formatters overlap. This adds formatting immediately after supported agent edits; skip duplicate tooling when it already suffices."
  review: docs/reviews/2026-10-29-format-after-edit.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Useful where formatter feedback is late; avoid duplicate editor/pre-commit work and test the actual client. Static curator assessment; no new behavioral trial.
