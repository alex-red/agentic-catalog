schemaVersion: 2
id: format-after-edit
type: hook
title: Format after agent edits
summary: A PostToolUse formatter for explicit edited paths in Claude Code and Codex, including newly added apply_patch files. Uses argument arrays instead of whitespace-splitting xargs and avoids unrelated dirty files.
useWhen: The project has a formatter, and agents leave style drift or spend turns fixing formatting.
tags:
  - formatting
  - automation
  - post-tool-use
hosts:
  - claude-code
  - codex
rating:
  usefulness: 4
  quality: 4
  portability: 3
  novelty: 4
  evidence: reviewed
  reviewed: 2026-10-28
  notes: Independent Python implementation of the documented formatting pattern, refreshed for explicit path handling. Scratch checks cover spaces, quotes, leading dashes and new patch files. Requires a locally installed formatter. No host behavior or matched outcome evaluation.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
inspiredBy:
  - title: Claude Code hooks guide, auto-format after edits
    url: https://code.claude.com/docs/en/hooks-guide
  - title: Codex hooks
    url: https://developers.openai.com/codex/hooks
overlap: Editor save hooks and pre-commit formatters overlap. This adds formatting immediately after supported agent edits; skip duplicate tooling when it already suffices.
related:
  - protect-files-and-commands
  - stop-gate-checks
