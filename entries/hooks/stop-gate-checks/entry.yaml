schemaVersion: 2
id: stop-gate-checks
type: hook
title: Block "done" until checks pass
summary: A Stop hook that runs the project's fast typecheck, lint, or tests when the agent tries to finish, and blocks with the failure output until they pass. It has guards against looping and against pure question turns.
useWhen: Agents end turns with failing checks, or unattended sessions must not finish red.
tags:
  - verification
  - quality-gate
  - autonomous-loop
  - stop-hook
hosts:
  - claude-code
  - codex
rating:
  rubric: human-v1
  dimensions:
    value: 2
    dependability: 2
    cognitiveEase: 2
    control: 3
    adoption: 2
    compatibility: 3
    upkeep: 3
  context: "Developers working on this task: Agents end turns with failing checks, or unattended sessions must not finish red. Declared hosts: claude-code, codex."
  baseline: "Comparison baseline and alternatives: The /goal command in Claude Code and Codex; CI."
  review: docs/reviews/2026-10-29-stop-gate-checks.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: A bounded reminder, not an invariant that checks pass; whole-tree dirtiness is not turn ownership. Static curator assessment; no new behavioral trial.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
