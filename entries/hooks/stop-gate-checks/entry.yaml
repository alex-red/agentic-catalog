schemaVersion: 2
id: stop-gate-checks
type: hook
title: Block "done" until checks pass
summary: A Stop hook that runs the project's fast typecheck, lint, or tests when the agent tries to finish, and blocks with the failure output until they pass. It has guards against looping and against pure question turns.
useWhen: Agents end turns with failing checks, or unattended sessions must not finish red.
tags:
  - verification
  - quality-gate
  - autonomous-loop
  - stop-hook
hosts:
  - claude-code
  - codex
rating:
  usefulness: 4
  quality: 3
  portability: 3
  novelty: 3
  evidence: reviewed
  reviewed: 2026-10-28
  notes: Refreshed to detect untracked-only changes. The retry guard allows ending after one blocked Stop; this is a bounded reminder, not an invariant that checks always pass. Whole-tree dirtiness includes pre-existing changes. Scratch script checks do not establish host behavior.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
inspiredBy:
  - title: Claude Code best practices, gating the stop with a Stop hook
    url: https://code.claude.com/docs/en/best-practices
  - title: Claude Code hooks guide
    url: https://code.claude.com/docs/en/hooks-guide
  - title: Codex hooks
    url: https://developers.openai.com/codex/hooks
overlap: The /goal command in Claude Code and Codex; CI.
related:
