schemaVersion: 2
id: compact-context
type: hook
title: Restore a small compaction note
summary: Reinjects a maintained, size-limited project note after compaction in Claude Code or Codex. Each harness reads its own project-local note.
useWhen: Compaction repeatedly loses a few critical details that are not already covered by loaded project instructions.
tags:
  - context
  - compaction
  - session-start
hosts:
  - claude-code
  - codex
rating:
  usefulness: 4
  quality: 4
  portability: 4
  novelty: 3
  evidence: reviewed
  reviewed: 2026-10-28
  notes: Claude reads CLAUDE_PROJECT_DIR; the Codex adapter infers the project from its .codex/hooks installation and reads .codex/compact-context.md. Bounded to 6000 UTF-8 bytes. Missing/oversize/outside-root notes are not loaded. Source-level fixtures only; host invocation remains unverified.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
  notes: Independent implementation of the cited pattern; no upstream code copied. Host behavior is not established by local script checks.
inspiredBy:
  - title: Claude Code hook documentation
    url: https://code.claude.com/docs/en/hooks-guide#re-inject-context-after-compaction
  - title: Official Codex hooks contract
    url: https://learn.chatgpt.com/docs/hooks
install:
  claude-code: Read HOOK.md, copy this entry's runtime files into .claude/hooks/compact-context/, and merge settings.example.json into the project's .claude/settings.json. Review the command and its effects before enabling; preserve existing hooks.
  notes: Project-local opt-in. Running the generated setup command registers this hook; the handler is not executed during setup.
  codex: Read HOOK.md. In a trusted local Git project, copy this entry's runtime files into .codex/hooks/compact-context/ and merge codex-hooks.example.json into .codex/hooks.json without replacing existing handlers. Review and trust the exact definition in /hooks. The example resolves its script from the Git root; do not copy Claude's args or onFailure fields into Codex. Project-local installation only; no activation is performed by the catalog.
overlap: CLAUDE.md, auto memory and compaction already preserve context. Use only for demonstrated gaps; handoff and retrospective provide broader state and instruction workflows.
related:
  - handoff
  - retrospective
