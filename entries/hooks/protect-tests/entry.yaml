  notes: Read the complete runtime script, README, manifest, hook registration. Tests were inventoried, not fully reviewed or executed. Node.js; local decision logs under ~/.claude/hooks-logs. Intentional test removal or skips may require a human edit; no auto-approval is added.
install:
  claude-code: For a reproducible manual install, obtain karanb192/claude-code-hooks at 63e0354bdf6ec56dd508d8ceef33b416ab6d8b14, retain its root LICENSE, and register only plugins/protect-tests as a local plugin using your host's local marketplace workflow. For a session-local smoke check, use claude --plugin-dir /absolute/path/to/plugins/protect-tests. Upstream's convenient tracking install is /plugin marketplace add karanb192/claude-code-hooks then /plugin install protect-tests@claude-code-hooks; it follows marketplace updates rather than this catalog pin. Review commands, policy and local logging before enabling.
  notes: "Node.js; local decision logs under ~/.claude/hooks-logs. Intentional test removal or skips may require a human edit; no auto-approval is added. Do not combine the individual guard with upstream guard-pack, which duplicates it. Harness review: Codex apply_patch inputs do not have Edit old_string/new_string fields. A correct adapter must inspect patch operations and test-file diffs; matching Edit aliases alone silently misses them. Keep Claude-only until implemented."
overlap: stop-gate-checks checks results; test-driven-development guides process. This targets an evasion those checks do not detect. CI and human review remain needed.
