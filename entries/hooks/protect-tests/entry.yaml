schemaVersion: 2
id: protect-tests
type: hook
title: Prevent disabling tests
summary: Detects common test deletion, disabling renames, and newly introduced skip/xfail markers before agent edits and shell calls.
useWhen: Agents have made failing suites pass by removing or skipping tests instead of fixing code.
tags:
  - testing
  - guardrails
  - pre-tool-use
hosts:
  - claude-code
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 2
    cognitiveEase: 3
    control: 3
    adoption: 3
    compatibility: 3
    upkeep: 3
  context: "Developers working on this task: Agents have made failing suites pass by removing or skipping tests instead of fixing code. Declared hosts: claude-code."
  baseline: "Comparison baseline and alternatives: stop-gate-checks checks results; test-driven-development guides process. This targets an evasion those checks do not detect. CI and human review remain needed."
  review: docs/reviews/2026-10-29-protect-tests.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: A heuristic tripwire for named test removals, not semantic test integrity or comprehensive write protection. Static curator assessment; no new behavioral trial.
