install:
  claude-code: /plugin marketplace add trailofbits/skills, then /plugin install open-sourcing@trailofbits
  codex: codex plugin marketplace add trailofbits/skills, then codex plugin add open-sourcing@trailofbits
  notes: The marketplace install tracks upstream rather than this pin. Other hosts can copy plugins/open-sourcing/skills/open-sourcing, including references/ and scripts/, from the pinned revision and keep the CC-BY-SA-4.0 attribution. The scripts need bash and git. gitleaks or trufflehog are optional for the history scan.
overlap: oss-repo-health audits an already-public repository's ongoing practices and hands the pre-release secrets audit to this entry. github-actions-hardening reviews workflows in more depth. Hosts have no built-in release-readiness workflow.
related: [oss-repo-health, github-actions-hardening, variant-analysis]
