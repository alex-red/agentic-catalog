  - accessibility
  - html
  - frontend
  - code-review
  - keyboard
hosts:
  - any
experimental: true
rating:
  usefulness: 4
  quality: 3
  portability: 5
  novelty: 2
  evidence: reviewed
  reviewed: 2026-10-28
  notes: Complete entrypoint and MIT license reviewed. Broad Tab-reachability wording needs composite-widget exceptions; arrow-key and roving-tabindex patterns remain valid. Review checks do not certify WCAG conformance or replace assistive-technology testing. No behavioral evaluation.
