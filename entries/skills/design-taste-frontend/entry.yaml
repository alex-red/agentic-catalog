schemaVersion: 2
id: design-taste-frontend
type: skill
title: Art direction and browser gates (Taste)
summary: Deals art directions from a local library, develops a subject-specific concept and interactive element, and combines source linting, browser measurements and screenshot critique. Includes separate app-screen guidance and strict house-style checks.
useWhen: Explicitly trying a strict art-direction system for a marketing page or app screen and accepting its style policy and browser-tool overhead.
tags:
  - frontend
  - design
  - visual-design
  - browser
hosts:
  - any
experimental: true
rating:
  usefulness: 4
  quality: 3
  portability: 3
  novelty: 4
  evidence: reviewed
  reviewed: 2026-10-28
  notes: Experimental house style, not a universal design standard. Entrypoint, study/test sections and inspector paths reviewed; full browser/media chain not audited. Marketing motion quota and banned devices can conflict with a brand. Author's small model-judged tests do not establish general superiority.
