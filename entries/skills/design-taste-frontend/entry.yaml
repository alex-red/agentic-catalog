  notes: Install directory must be named design-taste-frontend, matching frontmatter rather than source folder. Keep scripts, libraries, references and assets together. Full inspection needs Node 22+ and Chrome-family tooling; .taste-skill artifacts and media fetching are part of use.
install:
  any: Fetch https://github.com/Leonxlnx/taste-skill at af8a897996e159ccc89c9da535dff714d5dba62d. Copy the entire skills/taste-skill subtree into .claude/skills/design-taste-frontend for Claude Code or .agents/skills/design-taste-frontend for Codex, preserving all nested files. Retain the repository-root LICENSE as LICENSE.txt in the installed directory. Check for an existing skill and preserve local changes rather than overwriting it.
  notes: Catalog admission does not activate this guidance, dependencies, hooks, external services or sibling workflows. Preserve user authorization and project conventions. See https://github.com/alex-red/agentic-catalog/blob/main/docs/frontend-design-options.md for selection and known limitations.
overlap: Alternative to frontend-design and Impeccable, with stronger house-style enforcement. Native browser tools and webapp-testing cover screenshots and behavior. emil-design-eng, remove-animations and baseline-ui conflict with its marketing motion policy.
related:
