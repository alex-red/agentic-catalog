schemaVersion: 2
id: property-based-testing
type: skill
title: Property-based testing (Trail of Bits)
summary: Writes, reviews, and debugs property-based tests with Hypothesis, fast-check, proptest, jqwik, rapid, and Solidity fuzzers. It catalogs roundtrip, oracle, idempotence, and invariant properties by strength, rejects tautological and vacuous properties, separates a wrong property from a real bug in a shrunk counterexample, and accepts that example tests can be the better fit.
useWhen: Code has an algebraic shape (encode and decode pairs, parsers, normalizers, comparators, data structures, contract invariants), or existing property tests need review.
tags: [testing, property-based-testing, fuzzing, hypothesis, fast-check]
