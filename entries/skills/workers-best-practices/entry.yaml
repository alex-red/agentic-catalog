title: Cloudflare Workers best practices
summary: Cloudflare's guidance for writing and reviewing Workers. It treats the project's compatibility date, flags, generated binding types, and Wrangler schema as the baseline, and flags buffered unbounded bodies, floating promises, request state at module scope, unbound ctx methods, hand-written Env types, and mismatched serialization at Queue, Workflow, storage, and WebSocket boundaries.
