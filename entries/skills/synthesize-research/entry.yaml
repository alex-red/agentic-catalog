schemaVersion: 2
id: synthesize-research
type: skill
title: Synthesize supplied user research (Anthropic)
summary: Turns existing interview notes, survey responses and feedback into attributed themes, contradictions, conditional behavioral segments and decision-linked recommendations. Selects the product-management skill rather than the similarly named design-plugin template.
useWhen: Existing research records need analysis into supported findings and product decisions, rather than preparing a new study or inspecting an interface.
tags: [ux, research, synthesis, product-management, evidence]
hosts: [any]
rating:
  usefulness: 4
  quality: 4
  portability: 4
  novelty: 4
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Complete entrypoint and connector reference reviewed. Attribution, contrary cases and conditional personas add useful discipline. Finding counts, impact arithmetic and NPS commentary remain heuristics. Deduplicate participants and reports; sample frequencies do not imply prevalence. Requires a documented local-link adapter. No behavioral trial. Scoped product-management license verified; preserve source and adapter provenance.
source:
