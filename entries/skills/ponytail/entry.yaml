  evidence: reviewed
  reviewed: 2026-10-20
  notes: An unusually clear reuse ladder with explicit never-cut items. Experimental because the upstream benchmark (39 tasks, Bash disabled) shows similar correctness to baseline (87/90 vs 86/90) and mostly measures smaller output. Its trigger covers any coding task and it stays on for the session, so it is easy to over-apply. Upstream reports large adoption.
