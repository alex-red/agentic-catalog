id: create-adaptable-composable
type: skill
title: Adaptable Vue composables
summary: A short guide to writing Vue composables that accept a plain value, a ref, or a getter. It uses MaybeRefOrGetter for read-only inputs and MaybeRef for writable ones, normalizes with toRef() for watch sources and toValue() for one-off reads, and warns against typing callback parameters as getters, where they would be invoked by mistake.
useWhen: Writing or refactoring a reusable Vue 3 composable whose inputs may be plain values, refs, or getters.
