schemaVersion: 2
id: conventional-commit-message
type: skill
title: Release-aware Conventional Commit messages
summary: Chooses a Conventional Commits type by release impact rather than file path, distinguishing changelog-visible types from hidden ones and flagging contract changes that are breaking, such as raised engine minimums or narrowed exports. It derives monorepo scopes from workspace packages, validates with the local commitlint binary, and outputs a message without committing.
useWhen: Writing commit messages in a repository whose releases and changelog are generated from commits, such as with conventional-changelog, release-please or semantic-release.
tags: [commits, conventional-commits, releases, monorepo]
hosts: [any]
rating:
  usefulness: 3
  quality: 4
  portability: 4
  novelty: 3
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Complete 264-line file read at the pin; spec rules on footers, BREAKING CHANGE casing and token hyphens are accurate. The release-impact red flags are the distinctive part. Tuned to the conventionalcommits preset; whether hidden types bump depends on the release tool. One example puts an issue reference in the subject, contradicting its own footer rule. Message-only, so it does not commit.
source:
  kind: linked
  url: https://github.com/conventional-changelog/conventional-changelog
  path: skills/conventional-commit-message
  revision: 74a977a970f0eb5cdf317538baec8290eb909a05
  retrieved: 2026-10-29
  license: ISC
  author: conventional-changelog team
  notes: The SKILL.md frontmatter declares MIT, while the repository root LICENSE.md and package.json are ISC. Both are permissive, but linked rather than vendored until upstream reconciles them. It runs rg and the local commitlint binary, falling back to npx or pnpm only when acceptable.
install:
  any: Fetch https://github.com/conventional-changelog/conventional-changelog at 74a977a970f0eb5cdf317538baec8290eb909a05 and copy skills/conventional-commit-message into .claude/skills/ for Claude Code or .agents/skills/ for Codex. Keep the repository LICENSE.md with it.
  notes: Pair it with git-commit or commit-history-hygiene when the agent should also commit; this skill only proposes messages.
overlap: git-commit covers the Conventional Commits format with a basic type table and commits. committing-with-commitlint validates against enforced rules. This adds release-impact typing and monorepo scope rules for commit-driven release tooling.
related: [git-commit, committing-with-commitlint, commit-history-hygiene]
