schemaVersion: 2
id: conventional-commit-message
type: skill
title: Release-aware Conventional Commit messages
summary: Chooses a Conventional Commits type by release impact rather than file path, distinguishing changelog-visible types from hidden ones and flagging contract changes that are breaking, such as raised engine minimums or narrowed exports. It derives monorepo scopes from workspace packages, validates with the local commitlint binary, and outputs a message without committing.
useWhen: Writing commit messages in a repository whose releases and changelog are generated from commits, such as with conventional-changelog, release-please or semantic-release.
tags: [commits, conventional-commits, releases, monorepo]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 3
    compatibility: 3
    upkeep: 3
  context: "Developers working on this task: Writing commit messages in a repository whose releases and changelog are generated from commits, such as with conventional-changelog, release-please or semantic-release. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: git-commit covers the Conventional Commits format with a basic type table and commits. committing-with-commitlint validates against enforced rules. This adds release-impact typing and monorepo scope rules for commit-driven release tooling."
  review: docs/reviews/2026-10-29-conventional-commit-message.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Useful with commit-driven releases; visible/hidden type semantics are preset-specific, not universal SemVer rules. Static curator assessment; no new behavioral trial.
