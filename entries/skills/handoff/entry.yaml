schemaVersion: 2
id: handoff
type: skill
title: Handoff document for a fresh session
summary: An explicitly invoked skill that writes a handoff document for a fresh agent to continue the current work. It saves the document to the OS temporary directory, references existing specs, plans, ADRs, and commits instead of copying them, redacts secrets and personal data, suggests skills for the next session, and tailors the document to the next session's stated focus.
useWhen: You are ending a long session and want a new session or another agent to continue the work without replaying the conversation.
tags: [handoff, context, memory]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 2
    cognitiveEase: 3
    control: 4
    adoption: 3
    compatibility: 3
    upkeep: 4
  context: "Developers working on this task: You are ending a long session and want a new session or another agent to continue the work without replaying the conversation. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: Host compaction (Claude Code's /compact and Codex's automatic compaction) summarizes context within the same session. This skill instead writes a file that a different session or agent can read."
  review: docs/reviews/2026-10-29-handoff.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Useful for a fresh chat; reviewers should check that unresolved constraints and rejected approaches survived summarization. Static curator assessment; no new behavioral trial.
