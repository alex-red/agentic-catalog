schemaVersion: 2
id: github-actions-hardening
type: skill
title: GitHub Actions hardening review
summary: A report-only security review of workflow files covering trigger trust levels, script injection through expression interpolation, privileged triggers running fork code, least-privilege token permissions, SHA-pinning of actions, GITHUB_ENV and output injection, secrets, OIDC and self-hosted runners. Findings come with severity, exact lines and before/after fixes.
useWhen: Reviewing, writing or hardening .github/workflows files, especially ones using pull_request_target, workflow_run or issue_comment.
tags: [security, github-actions, ci, supply-chain, audit]
hosts: [any]
rating:
  usefulness: 4
  quality: 4
  portability: 5
  novelty: 4
  evidence: reviewed
  reviewed: 2026-10-29
  notes: All six files read at the pin. The core insight (expressions are pasted into the script before the shell runs) and the two-workflow pattern are correct and well taught. It never applies changes. Its trust matrix presents token scopes as fixed, but they follow repository default permissions. The workflow_run example downloads an artifact without the run-id and github-token inputs that a cross-run download needs. It reasons only, without running zizmor or actionlint. No trigger or outcome evaluation has been run.
