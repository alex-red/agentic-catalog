schemaVersion: 2
id: secret-serialization
type: skill
title: Secret serialization review (Sentry)
summary: An opt-in review for credentials that leak through generated serialization. It pairs a holder (a secret field on a dataclass, pydantic model, or JavaScript object) with a sink (logs, spans, error context, caches, or responses that serialize whole objects), searches the whole repository for the missing side, and grades each finding by the path that is still unblocked.
useWhen: A change adds a credential field to a dataclass, model, or config object, or adds code that stringifies whole objects or every kwarg into logs or telemetry, in Python or JavaScript and TypeScript.
