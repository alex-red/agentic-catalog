schemaVersion: 2
id: committing-with-commitlint
type: skill
title: Commit in commitlint repositories
summary: Detects commitlint, reads the enforced rules with --print-config, explains the severity/applicability/value rule format, validates the full message through stdin before committing, and corrects only the rules named in a hook rejection instead of bypassing the hook.
useWhen: A repository enforces commit messages with commitlint, through husky, lefthook or a commit-msg hook, and agent commits keep getting rejected.
tags: [commits, conventional-commits, git, quality-gate]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 3
    cognitiveEase: 3
    control: 3
    adoption: 3
    compatibility: 3
    upkeep: 3
  context: "Developers working on this task: A repository enforces commit messages with commitlint, through husky, lefthook or a commit-msg hook, and agent commits keep getting rejected. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: git-commit covers Conventional Commits generally and also reads commitlint configuration, but does not validate before committing or interpret rejections. Host commit procedures say not to skip hooks but give no recovery method."
  review: docs/reviews/2026-10-29-committing-with-commitlint.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: "Prefer the project-local executable: upstream npx commands can download packages. Intended for existing commitlint repositories. Static curator assessment; no new behavioral trial."
source:
  kind: vendored
  url: https://github.com/conventional-changelog/commitlint
  path: skills/committing-with-commitlint
