  quality: 3
  portability: 5
  novelty: 3
  evidence: reviewed
  reviewed: 2026-10-20
  notes: The writing-good-tests reference is excellent. The main skill is dogmatic ("write code before the test? Delete it."), and its trigger fires on any feature or bugfix, which can clash with exploratory work or project conventions. Consider narrowing the description after installing.
