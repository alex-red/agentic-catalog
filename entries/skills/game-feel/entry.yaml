  baseline: "Comparison baseline and alternatives: Native design reasoning covers audiovisual polish; emil-design-eng addresses interface motion; human-interface-design addresses general feedback and access. This targets gameplay event timing, simulation boundaries, repeated impact and effect ownership without requiring an engine or motion library."
