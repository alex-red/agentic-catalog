id: game-feel
type: skill
title: Responsive and readable gameplay feedback
summary: Improves existing actions through proportionate timing and audiovisual response, with input, simulation, effect ownership and accessibility constraints. Avoids universal effect recipes and unverified global hit-stop helpers.
useWhen: Tuning the responsiveness, impact or readability of hits, jumps, pickups and other gameplay events, including repeated effects and camera motion.
