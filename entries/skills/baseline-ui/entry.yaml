  notes: Complete entrypoint and MIT license reviewed. Mandates Tailwind, motion/react and cn; forbids unsolicited motion, custom easing and tracking. Blanket destructive-dialog and animation rules are house policy. Poor fit for other stacks or conflicting established conventions. No behavior evaluation.
