title: Opinionated React UI baseline (Ibelick)
summary: Applies a concise UI house policy for Tailwind, accessible React primitives, class composition, hierarchy, state handling and restrained motion. Produces snippet-level findings with concrete fixes for fast interface cleanup.
useWhen: Explicitly adopting a strict baseline in a compatible React and Tailwind project rather than seeking stack-neutral design guidance.
