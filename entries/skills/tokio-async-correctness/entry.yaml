title: Tokio async correctness
summary: Trace task ownership, partial progress, capacity and shutdown through Tokio flows. Distinguish cancellation data loss from fairness loss, detached handles from aborting task sets, and application errors from join errors. Includes a bounded intake/drain example.
useWhen: Reviewing or fixing Tokio select loops, lost work, orphan tasks, closed-channel spins, unbounded spawning or shutdown behavior.
