schemaVersion: 2
id: commit-history-hygiene
type: skill
title: Reviewable commit history
summary: Plans a series of self-contained commits, splits mixed edits without interactive staging, writes why-focused messages in the long-standing Git style when the repository has no convention, verifies every commit with rebase --exec, folds review fixes in with fixup commits and non-interactive autosquash, and handles trailers and signing without overreach.
useWhen: Committing a body of work as several commits, tidying a branch before review, squashing fixups, or adding co-author or sign-off trailers.
tags: [commits, git, code-review, conventions]
hosts: [any]
rating:
  usefulness: 4
  quality: 4
  portability: 5
  novelty: 4
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Written for agents, which cannot drive git add -p or rebase -i. Non-interactive autosquash, rebase --exec stopping at the first failing commit, and the fixup forms that need an editor were exercised in a scratch repository on Git 2.51; the Git 2.44 autosquash change was checked against release notes. History rewriting and force pushes stay behind explicit user requests, and Signed-off-by is treated as the user's certification. No trigger or outcome evaluation has been run.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
  notes: Original prose distilled from Git documentation and established commit-message guides, written after reviewing the agent skills listed in the October 29 commit and open-source research. No upstream skill text is copied.
inspiredBy:
