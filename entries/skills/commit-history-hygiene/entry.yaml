    url: https://cbea.ms/git-commit/
  - title: Tim Pope, A Note About Git Commit Messages
    url: https://tbaggery.com/2008/04/19/a-note-about-git-commit-messages.html
  - title: Linux kernel, Submitting patches (separate your changes, describe them)
    url: https://docs.kernel.org/process/submitting-patches.html
  - title: git-rebase documentation (--autosquash, --exec)
    url: https://git-scm.com/docs/git-rebase
  - title: git-interpret-trailers documentation
    url: https://git-scm.com/docs/git-interpret-trailers
  - title: GitHub, Creating a commit with multiple authors
    url: https://docs.github.com/en/pull-requests/committing-changes-to-your-project/creating-and-editing-commits/creating-a-commit-with-multiple-authors
  - title: Compound Engineering ce-commit (explicit pathspec staging, co-author email rule)
    url: https://github.com/EveryInc/compound-engineering-plugin/blob/c27add907c3a4e59713075e76049a8b0c8b4ec01/skills/ce-commit/SKILL.md
overlap: Host commit procedures cover single commits, explicit staging and no hook skipping. git-commit and committing-with-commitlint cover message format and validation and defer to this for series and fixups. No host or catalog entry covers commit planning, non-interactive splitting, per-commit verification or autosquash.
related: [git-commit, committing-with-commitlint, git-safety, focused-changes]
