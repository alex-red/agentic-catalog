schemaVersion: 2
id: commit-history-hygiene
type: skill
title: Reviewable commit history
summary: Plans a series of self-contained commits, splits mixed edits without interactive staging, writes why-focused messages in the long-standing Git style when the repository has no convention, verifies every commit with rebase --exec, folds review fixes in with fixup commits and non-interactive autosquash, and handles trailers and signing without overreach.
useWhen: Committing a body of work as several commits, tidying a branch before review, squashing fixups, or adding co-author or sign-off trailers.
tags: [commits, git, code-review, conventions]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 4
    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 3
    compatibility: 3
    upkeep: 3
  context: "Developers working on this task: Committing a body of work as several commits, tidying a branch before review, squashing fixups, or adding co-author or sign-off trailers. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: Host commit procedures cover single commits, explicit staging and no hook skipping. git-commit and committing-with-commitlint cover message format and validation and defer to this for series and fixups. No host or catalog entry covers commit planning, non-interactive splitting, per-commit verification or autosquash."
  review: docs/reviews/2026-10-29-commit-history-hygiene.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Improves reviewable history; staged intermediate versions and rebase checks still require careful supervision. Static curator assessment; no new behavioral trial.
