  notes: Plugin 1.3.2. Read-only and needs no sibling skills. Remote mode and cross-file resolution fetch workflows and local actions with gh api at whatever ref the caller wrote, treating them as data. Third-party actions are skipped without being listed as a coverage gap.
install:
  claude-code: /plugin marketplace add trailofbits/skills, then /plugin install agentic-actions-auditor@trailofbits
  codex: codex plugin marketplace add trailofbits/skills, then codex plugin add agentic-actions-auditor@trailofbits
  notes: The marketplace install tracks upstream rather than this pin. Other hosts can copy the skill directory with references/ from the pinned revision and keep the CC-BY-SA-4.0 attribution. Remote mode needs an authenticated gh CLI. Do not copy the AI-output remediation in references/action-profiles.md; pass model output through env and quote the shell variable instead.
overlap: github-actions-hardening covers general workflow hardening, including direct expression injection and pull_request_target checkout, which this also checks. This adds the agent-specific vectors and action settings. Host security review does not cover workflow configuration.
related: [github-actions-hardening, oss-repo-health, security-threat-model]
