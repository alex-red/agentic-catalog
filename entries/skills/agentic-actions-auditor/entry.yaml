schemaVersion: 2
id: agentic-actions-auditor
type: skill
title: Audit AI agents in GitHub Actions (Trail of Bits)
summary: A read-only audit of workflows that run AI coding agents (claude-code-action, Codex, Gemini CLI, ai-inference). It traces attacker-controlled input into agent prompts through nine vectors, including environment-variable intermediaries, runtime gh fetches, error-log injection and eval of model output, and treats permissive sandbox or tool settings as amplifiers. Findings come with data-flow traces.
useWhen: Reviewing workflows that invoke an AI agent action, especially ones triggered by issues, comments or pull_request_target.
tags: [security, github-actions, ci, audit]
hosts: [any]
experimental: true
rating:
  usefulness: 4
  quality: 3
  portability: 4
  novelty: 4
  evidence: reviewed
  reviewed: 2026-10-29
  notes: All 17 files read at the pin. Covers agent-specific sinks a general reviewer misses. Defects verified at the pin. The AI-output remediation labelled SAFE puts model output in single quotes inside run:, which is still injectable, and names a wrong output (result, not response). Gemini sandbox defaults contradict across files. Vector H omits bypass-permission flags. Action input names will drift. Experimental for these reasons.
