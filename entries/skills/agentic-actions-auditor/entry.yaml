schemaVersion: 2
id: agentic-actions-auditor
type: skill
title: Audit AI agents in GitHub Actions (Trail of Bits)
summary: A read-only audit of workflows that run AI coding agents (claude-code-action, Codex, Gemini CLI, ai-inference). It traces attacker-controlled input into agent prompts through nine vectors, including environment-variable intermediaries, runtime gh fetches, error-log injection and eval of model output, and treats permissive sandbox or tool settings as amplifiers. Findings come with data-flow traces.
useWhen: Reviewing workflows that invoke an AI agent action, especially ones triggered by issues, comments or pull_request_target.
tags: [security, github-actions, ci, audit]
hosts: [any]
experimental: true
rating:
  rubric: human-v1
  dimensions:
    value: 4
    cognitiveEase: 3
    control: 4
    adoption: 3
    compatibility: 3
    upkeep: 2
  context: "Developers working on this task: Reviewing workflows that invoke an AI agent action, especially ones triggered by issues, comments or pull_request_target. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: github-actions-hardening covers general workflow hardening, including direct expression injection and pull_request_target checkout, which this also checks. This adds the agent-specific vectors and action settings. Host security review does not cover workflow configuration."
  review: docs/reviews/2026-10-29-agentic-actions-auditor.md
  unknowns:
    - "Dependability: core plus vector G/action profiles were read; foundations, other vectors and cross-file-resolution remain uninspected in this pass."
  blockers:
    - scope: GitHub AI Inference remediation in references/action-profiles.md
      reason: The example labeled SAFE interpolates model output into a single-quoted run script, which an embedded quote can escape; it also conflicts with vector G on the output field. Do not copy that remediation.
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Useful specialist audit structure, but unsafe remediation and unreviewed required references prevent an aggregate. Static curator assessment; no new behavioral trial.
