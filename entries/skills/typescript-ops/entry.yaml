install:
  notes: Copy the entire directory including references, assets, scripts, tests and LICENSE.txt. Resolve helper paths from the installed skill directory. The optional freshness helper needs Python 3; --offline reads packaged files, --live queries the configured npm registry. The optional self-test needs Bash and Python and writes temporary files/bytecode. Do not schedule these or adopt sibling skills implicitly. Preserve project tools and authorization; consult the scoped blockers before applying recipes.
overlap: Ordinary model behavior and the compiler cover everyday syntax and diagnostics. This session lists no dedicated general TypeScript host skill; no claim is made about every host release. monorepo-change-verification owns cross-package graphs, secret-serialization owns serialization leaks, workers-best-practices owns Workers behavior, and create-adaptable-composable/vue-async-state own Vue concerns. This entry adds consolidated type references and a TS7 API/configuration migration checklist. Official documentation remains the simpler authority for release details; compiler and ecosystem compatibility must be checked per project.
