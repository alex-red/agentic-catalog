title: TypeScript types and native compiler adoption
summary: Type modeling, generics, utility types, strict configuration and runtime validation, with a dedicated TypeScript 7 native compiler adoption guide. Experimental reference option; known configuration and type-example defects require independent verification.
useWhen: Reviewing TypeScript types or planning a TypeScript 7 migration, especially compiler API consumers, configuration changes and side-by-side compiler installs, with project-specific verification.
tags: [typescript, migration, build-systems, monorepo, testing]
hosts: [any]
experimental: true
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 1
    cognitiveEase: 2
    control: 3
    adoption: 3
    compatibility: 2
    upkeep: 3
  context: Developers reviewing TypeScript types or assessing migration to the native TypeScript 7 compiler; use as a checked reference, not a copy-ready configuration or utility library.
  baseline: Ordinary model assistance plus the project-local compiler and official TypeScript migration documentation. monorepo-change-verification covers package graphs; secret-serialization and workers-best-practices cover narrower TypeScript risks. No dedicated general TypeScript skill is listed among this session's installed host skills.
  review: docs/reviews/2026-10-30-typescript-ops.md
  blockers:
    - scope: Unchanged configuration and advanced type examples
      reason: The references retain TS7-incompatible Node resolution templates, reverse a strictFunctionTypes assignment explanation, overclaim satisfies literal preservation and include a Promisify constraint that rejects its own example. Verify or replace affected recipes before use.
    - scope: TS7 migration readiness and diagnostic parity
      reason: npm ls cannot prove the absence of compiler API imports; plain TS/TSX projects can still depend on that API. The guide also treats every diagnostic difference as a compiler bug despite documented intentional changes. Inspect actual tooling and classify differences before migration.
  evidence: reviewed
  reviewed: 2026-10-30
  notes: Broad TS7-aware reference with useful adoption concerns, but confirmed example defects and overbroad migration claims limit endorsement. Freshness helpers check package names/majors, not technical correctness or minor-version compatibility. Author benchmarks are not catalog outcomes. Experimental; no activation or matched trial.
