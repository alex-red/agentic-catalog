schemaVersion: 2
id: catalog-taxonomy
type: skill
title: Design catalog taxonomies and facets
summary: Designs or audits catalog classification through stable concepts, scoped facets, conservative aliases, explicit retrieval semantics and compatible migrations. Keeps specialist keywords discoverable without turning every term into a navigation category.
useWhen: Designing a catalog's tagging system, auditing vocabulary drift, defining discovery filters, or migrating established classification metadata.
tags: [system-design, taxonomy, information-architecture, search, discovery]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 3
    compatibility: 3
    upkeep: 4
  context: "Developers working on this task: Designing a catalog's tagging system, auditing vocabulary drift, defining discovery filters, or migrating established classification metadata. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: Native model reasoning covers ordinary tags, schemas and search design. domain-modeling maintains domain terminology and ADRs; human-interface-design addresses navigation and interaction; neither specifies catalog concept identity, facet counts and vocabulary migrations together. No catalog-taxonomy equivalent appears in this session's host skill inventory. Reuse an existing project vocabulary instead of introducing a competing registry."
  review: docs/reviews/2026-10-29-catalog-taxonomy.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Useful for real discovery problems; adds unjustified ceremony to a small stable tag list. Static curator assessment; no new behavioral trial.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
  notes: Independently authored from the catalog tagging research and public primary-source principles. No upstream prose, scripts, runtime or external service required; all installable guidance is bundled here.
