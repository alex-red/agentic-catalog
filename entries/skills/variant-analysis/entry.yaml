install:
  claude-code: /plugin marketplace add trailofbits/skills, then /plugin install variant-analysis@trailofbits
  codex: codex plugin marketplace add trailofbits/skills, then codex plugin add variant-analysis@trailofbits
  notes: Other hosts can copy the skill directory, including resources/, from the pinned revision; keep the CC-BY-SA-4.0 attribution and share-alike terms with it. CodeQL or Semgrep are optional.
overlap: Host review commands and the security-threat-model entry find issues in a diff or a design; none of them start from a known bug and expand it systematically.
