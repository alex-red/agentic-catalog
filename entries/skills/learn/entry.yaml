schemaVersion: 2
id: learn
type: skill
title: Learn from this session
added: 2026-11-23
summary: Distills a current-session correction, constraint, or working fix into a proposed rule, skill, or workflow documentation update. Shows exact edits and waits for approval before applying them.
useWhen: You invoke /learn or ask to preserve a specific lesson from the current session in durable agent guidance.
tags: [self-improvement, project-instructions, skill-authoring]
hosts: [any]
experimental: true
