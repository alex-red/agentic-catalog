overlap: Antigravity's native /learn already covers the core workflow there. Claude Code auto memory and Codex memories can retain corrections. Revise CLAUDE.md provides an approval-gated edit to Claude Code project instructions. Retrospective covers broader project improvements after a task, and Repo Retro reviews evidence across sessions. Learn focuses on exact edits to current-session guidance across hosts.
related: [retrospective, repo-retro, revise-claude-md, agents-md-authoring]
