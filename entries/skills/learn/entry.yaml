  rubric: human-v1
  dimensions:
    value: 2
    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 4
    compatibility: 3
    upkeep: 4
  context: Developers who want to preserve a current-session lesson as reviewable guidance for future agent work.
  baseline: Use Antigravity's native /learn where available, or ask for a small, reviewable edit to known project guidance.
  review: docs/reviews/2026-11-23-learn.md
  evidence: reviewed
  reviewed: 2026-11-23
  notes: Useful when the right destination or wording is unclear. The proposal adds a review step even for a small edit. Live activation and outcomes remain unmeasured.
