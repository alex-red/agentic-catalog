overlap: Asking the model directly to be more ambitious or to act as an expert, and plan mode. grilling stress-tests an existing plan through interview rounds; explore-plan-implement-review sequences execution. This adds a structured reframe of the request itself, with an outside-check requirement and a propose-then-act boundary.
