install:
  any: "Fetch https://github.com/ghaida/intent at 7111cb85894feaeb7e98938b1ed34597d40e3b4c. Copy the complete skills/intent subtree, including all eight references, into .agents/skills/intent or .claude/skills/intent. Retain root LICENSE as LICENSE.txt. Check the destination and preserve existing guidance. If the user selects a routed specialist, inspect and copy that complete skills/<name> subtree as a sibling at the same revision, with its resources and license; do not represent an absent sibling as available or install all eighteen merely because the router names them. Do not copy agents, hooks, plugin configuration or platform rules implicitly."
  notes: Catalog admission activates nothing. Context files, decision logs, specialist routing, design tools and iteration remain within the user's task and project conventions. See https://github.com/alex-red/agentic-catalog/blob/main/docs/ux-workflow-options.md for scope and unresolved review limits.
overlap: Native planning and design reasoning cover parts of the process. ux-critique specializes in interface criticism; synthesize-research starts from existing records; moderated-usability-study prepares real sessions; evidence-to-flow-ux is a smaller decision procedure. Frontend design entries emphasize visual execution. Intent is an alternative broad system, not a prerequisite for these entries.
