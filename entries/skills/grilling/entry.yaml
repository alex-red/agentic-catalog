schemaVersion: 2
id: grilling
type: skill
title: Grilling (design-tree interview)
summary: Stress-test a plan by interviewing the user in rounds over a design tree. Each round asks every question that can be answered now, each with a recommended answer. The agent looks up facts itself, and nothing is acted on until shared understanding is confirmed.
useWhen: Before building something ambiguous, when you want the agent to surface every open decision instead of silently assuming.
tags: [requirements, planning, interviewing]
hosts: [any]
rating:
  usefulness: 4
  quality: 5
  portability: 4
  novelty: 4
  evidence: reviewed
  reviewed: 2026-10-20
  notes: Tight and precise. "Word each question so yes accepts your recommendation" and "facts are the agent's job, decisions are the user's" are distinctive. It assumes subagents for fact-finding, but works without them.
