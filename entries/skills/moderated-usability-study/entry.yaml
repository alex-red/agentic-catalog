schemaVersion: 2
id: moderated-usability-study
type: skill
title: Prepare and analyze moderated usability studies
summary: Creates realistic task scenarios, participant criteria, moderator guides and observation records, or synthesizes actual session evidence. Separates study preparation and inspection hypotheses from findings about real participants.
useWhen: Preparing a study with real participants or analyzing its session records, especially when comprehension, findability or task behavior is unresolved.
tags: [ux, user-research, usability, study-planning]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 4
    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 3
    compatibility: 3
    upkeep: 4
  context: "Developers working on this task: Preparing a study with real participants or analyzing its session records, especially when comprehension, findability or task behavior is unresolved. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: Native agents can draft interview questions and summarize notes. ux-critique supplies expert inspection rather than participant evidence; synthesize-research handles broader existing datasets. This skill adds a focused session protocol and observation contract. It requires no study platform, calculator or other catalog entry."
  review: docs/reviews/2026-10-29-moderated-usability-study.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Good study discipline; participant access and organizational consent prerequisites are real costs. Static curator assessment; no new behavioral trial.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
  notes: Independently written from the reviewed study method. No upstream prose, scripts or sample data copied. Participant sizing is contextual; calculator helpers and absolute bans on interface terminology are not adopted.
inspiredBy:
