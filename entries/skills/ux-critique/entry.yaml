install:
  claude-code: Fetch source.url at source.revision. Copy the contents of skills/ux-critique into the project's .claude/skills/ux-critique, then copy the repository-root kb directory into that installed directory as kb. Include LICENSE, LICENSE-MIT, LICENSE-CC-BY-4.0, and THIRD_PARTY_NOTICES.md from the repository root. Check for an existing skill before copying.
  codex: Fetch source.url at source.revision. Copy the contents of skills/ux-critique into the project's .agents/skills/ux-critique, including agents/openai.yaml, then copy the repository-root kb directory into that installed directory as kb. Include LICENSE, LICENSE-MIT, LICENSE-CC-BY-4.0, and THIRD_PARTY_NOTICES.md from the repository root. Check for an existing skill before copying.
  any: Assemble the same complete skill and root kb bundle at the pinned revision in the host's skill directory, retaining all four root license and notice files. Keep references, scripts, facets, and kb-ids.json together with SKILL.md; do not install SKILL.md alone.
  notes: Start with Standard review in chat. Figma output needs a separately connected integration and explicit write authorization; installing this entry configures neither. Deep Flow uses workers for four or more screens by default; pass --serial to avoid that workflow. Upstream records aggregate local citation counts by default; set UX_CRITIQUE_DISABLE_USAGE=1 to disable recording. HTML artifact output is incomplete because its template is absent from this revision, and Apply Mode is experimental; neither is recommended here.
overlap: Generic model critique and frontend-design guidance already identify familiar UI issues. This entry adds an explicit observation, citation-support, skeptic, and confidence pipeline. webapp-testing and chrome-devtools-mcp collect runtime evidence but do not supply that critique method. grilling stress-tests decisions through questions; improvement-loop and retrospective improve agent tooling and process. None of these substitutes for observing real users.
related: [webapp-testing, chrome-devtools-mcp, grilling, verification-before-completion]
