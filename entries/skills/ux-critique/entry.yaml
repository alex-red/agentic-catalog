schemaVersion: 2
id: ux-critique
type: skill
title: Evidence-grounded UX critique (Thecsiz)
summary: Reviews interfaces and product flows by observing first, checking missing states, comparing relevant local UX references, verifying citation support, and challenging each finding with a skeptic pass. Reports concrete fixes with separate confidence labels and structural, behavioral, or visual classifications; chat is the default output.
useWhen: You want direct, evidence-grounded criticism of an app screen, prototype, screenshot, or connected user flow, with unsupported findings challenged before reporting.
tags: [ux, usability, design-review]
hosts: [any]
rating:
  usefulness: 4
  quality: 4
  portability: 3
  novelty: 4
  evidence: reviewed
  reviewed: 2026-10-21
  notes: Observation-first review, citation-support checks, and a skeptic pass add structure beyond generic critique. Fixed structural-over-visual ordering, a mandatory Brief check-in, and large KB dependencies limit it. Quick Scan checks IDs without auditing support. Expert critique is not user research. Core instructions and retrieval/usage scripts reviewed; 606 KB paths checked, not every body or Figma script audited. No behavioral evaluation; upstream receipt/retrieval fixtures do not establish critique quality.
