    upkeep: 3
  context: "Developers working on this task: You want to search the wider public skills registry, beyond this curated catalog. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: The agentic-catalog skill in this repository covers curated discovery. Claude Code's plugin browser and Codex's skill installer cover installation."
  review: docs/reviews/2026-10-29-find-skills.md
