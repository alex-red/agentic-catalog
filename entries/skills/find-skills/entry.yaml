id: find-skills
type: skill
title: Find skills on skills.sh
summary: Search the skills.sh registry with npx skills find, vet candidates by source, install count, and stars, and offer install commands.
useWhen: You want to search the wider public skills registry, beyond this curated catalog.
tags: [discovery, skills-registry, tooling]
hosts: [any]
