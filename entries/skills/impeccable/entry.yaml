install:
  any: Fetch https://github.com/pbakaus/impeccable at 7510e233b228864606888d252abacf5e7148bf87. Copy the entire .agents/skills/impeccable subtree into .claude/skills/impeccable for Claude Code or .agents/skills/impeccable for Codex, preserving all nested files. Retain the repository-root LICENSE as LICENSE.txt in the installed directory. Check for an existing skill and preserve local changes rather than overwriting it. Include root NOTICE.md. This manual route omits hooks and named subagents; begin with scoped polish/refinement. Commands requiring named agents need separately selected host setup; manual copying does not supply the full workflow.
  notes: Catalog admission does not activate this guidance, dependencies, hooks, external services or sibling workflows. Preserve user authorization and project conventions. See https://github.com/alex-red/agentic-catalog/blob/main/docs/frontend-design-options.md for selection and known limitations. The launcher may download a versioned native engine. Rolls contact an upstream API; IMPECCABLE_NO_TELEMETRY=1 disables telemetry but not roll requests. Manual context fallback exists. Full engine and live-edit security are not audited.
