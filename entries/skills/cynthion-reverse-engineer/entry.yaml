  reviewed: 2026-10-29
  notes: Complete entrypoint and sibling decoder loader read. Analysis/generator helpers and required decoder runtime are not fully audited. Two-capture ambiguity and fixed-length assumptions are disclosed upstream. No synthetic-helper run, hardware trial or agent outcome evaluation.
