id: cynthion-reverse-engineer
type: skill
title: Cynthion USB protocol investigation
summary: Structured USB protocol experiments using labelled captures, transaction differences, field hypotheses, replay/emulation scaffolds and a protocol document. Requires the sibling capture decoder and separately selected hardware tooling.
useWhen: Reverse engineering a proprietary USB device protocol from contrasting captures, or preparing a bounded replay/emulation experiment.
