install:
  any: Fetch https://github.com/curtisgalloway/public-skills at 322192876442b066dd31690a190773c7f903d099. Copy the complete plugins/hardware-lab/skills/cynthion-reverse-engineer and cynthion-pcap-decode subtrees as siblings in the selected .agents/skills or .claude/skills directory, including scripts, examples and references; retain root LICENSE as LICENSE.txt in both. Preserve existing destinations. Read the required decoder and all helpers used before executing them. Cynthion/Packetry support live capture; supplied decoded JSON can support offline analysis. tshark is recommended, libusb1 is needed for generated replay, and Facedancer for optional emulation. Do not install setup/capture sibling skills, adjust device permissions, replay traffic or clone hardware implicitly.
  notes: Admission activates nothing. Preserve project conventions and existing permissions. Runtime execution, hardware interaction, database writes and optional companions require the scope of the actual task. Source review only; see docs/reverse-engineering-options.md and the admission record for limits.
overlap: Generic debugging and file tools lack USB-specific capture differencing and command inference. REA covers broader application artifacts; reverse-engineering supplies a general analysis method. This specialist option requires its decoder and is not a default dependency of other RE entries.
