schemaVersion: 2
id: portless
type: skill
title: Portless named local URLs (Vercel)
summary: Replaces port numbers with stable https://<name>.localhost URLs through a local reverse proxy, with a subdomain per git worktree, so agents stop guessing ports or colliding on them. Ships a skill and an MCP server whose default tools only look up and alias routes.
useWhen: Agents run several dev servers, worktrees or monorepo apps at once and keep testing the wrong port, hitting EADDRINUSE, or mixing cookies across localhost apps.
tags: [dev-ux, dev-servers, local-urls, worktrees]
hosts: [any]
experimental: true
rating:
  rubric: human-v1
  dimensions:
    value: 4
    cognitiveEase: 3
    control: 1
    adoption: 2
    compatibility: 3
    upkeep: 2
  context: "Developers working on this task: Agents run several dev servers, worktrees or monorepo apps at once and keep testing the wrong port, hitting EADDRINUSE, or mixing cookies across localhost apps. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: No host built-in or catalog entry gives agents stable named local URLs. Host background processes and webapp-testing still choose ports themselves; portless can sit underneath them. dev3000 (not admitted) now requires it. Worktree-aware names complement worktrunk."
  review: docs/reviews/2026-10-29-portless.md
  unknowns:
    - Inspect remaining setup guidance, proxy, CA trust, hosts-sync and elevation paths; no privileged setup was executed.
