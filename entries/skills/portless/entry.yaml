  author: Vercel Labs
  notes: CLI 0.15.12; requires Node 24+ (and openssl on Windows). The skill is one self-contained file. The MCP server (portless mcp) is part of the CLI. Repository HEAD at review was a9561dcb891a10c37a9695c3f938007b8ba09f32.
install:
  any: 'npx skills add vercel-labs/portless --skill portless (follows the skills.sh layout; upstream documents no skill installer). The skill needs the CLI, which the user installs: npm install -D portless or npm install -g portless.'
  claude-code: 'Optional MCP, default core profile (list, get, alias): claude mcp add portless --scope project -- portless mcp'
  codex: 'Optional MCP: codex mcp add portless -- portless mcp, or [mcp_servers.portless] with command = "portless" and args = ["mcp"] in .codex/config.toml.'
  notes: 'Least-privilege setup: run the proxy on a high port (-p 1355) or with --no-tls, pass --skip-trust, and set PORTLESS_SYNC_HOSTS=0. Ask the user before starting the proxy on 443, running portless trust, hosts sync or service install, enabling --lan, or any tunnel (--tailscale, --funnel, --ngrok, --cloudflare publish the app). Keep the MCP on the core profile; the proxy and all profiles can start the daemon. The MCP command runs whatever portless is on PATH. portless clean removes the CA, hosts block and service.'
overlap: No host built-in or catalog entry gives agents stable named local URLs. Host background processes and webapp-testing still choose ports themselves; portless can sit underneath them. dev3000 (not admitted) now requires it. Worktree-aware names complement worktrunk.
related: [worktrunk, process-compose-mcp, webapp-testing, chrome-devtools-mcp]
