schemaVersion: 2
id: oss-repo-health
type: skill
title: Open-source repository health audit
summary: A read-only audit of a public repository, calibrated to project kind, covering the README, license consistency, contribution and community files, SECURITY.md and private reporting, dependency updates, branch rules, Semantic Versioning, Keep a Changelog and the release process. It reports prioritized findings with evidence, marks unreadable settings as unknown, and applies only approved changes.
useWhen: Reviewing or improving a public repository's practices, preparing it for outside contributors, or setting up versioning, a changelog or releases.
tags: [open-source, documentation, licensing, releases, github, audit]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 3
    compatibility: 3
    upkeep: 3
  context: "Developers working on this task: Reviewing or improving a public repository's practices, preparing it for outside contributors, or setting up versioning, a changelog or releases. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: open-sourcing covers the go-public event and secrets history; github-actions-hardening covers workflow security; GitHub's community profile shows file presence only. The OpenSSF Scorecard tool scores security practices automatically but not documentation or contributor experience."
  review: docs/reviews/2026-10-29-oss-repo-health.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Useful ongoing audit; several Must/Should judgments need project-specific calibration. Static curator assessment; no new behavioral trial.
