schemaVersion: 2
id: repo-retro
type: skill
title: Repo Retro
added: 2026-11-19
summary: Reviews repo-scoped session history or lessons notes and ranks up to three workflow proposals with evidence, a concrete target, and a verification step. The user decides which changes to apply in a follow-up.
useWhen: You want a retrospective across past sessions in one repository or a review of mistakes/lessons.md.
tags: [retrospective, self-improvement]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 3
    compatibility: 3
    upkeep: 4
  context: Developers reviewing recurring friction in one repository using available harness history, repository notes, or supplied transcript excerpts.
  baseline: Retrospective for a finished piece of work, or manually reviewing repository lessons notes and checking them against the current tree.
  review: docs/reviews/2026-11-19-repo-retro.md
  evidence: reviewed
  reviewed: 2026-11-20
  notes: Repository scoping and cited proposals help connect recurring incidents to current checks. Incomplete history or sparse notes limit what the review can conclude.
source:
  kind: adapted
  license: MIT
  author: Dev Catalog contributors
  notes: Adapted for Agentic Catalog with a narrower trigger, a repository-notes fallback, and an explicit follow-up before applying proposals. The package retains the upstream MIT notice.
inspiredBy:
  - title: Dev Catalog Repo Retro skill
    url: https://github.com/alex-red/dev-catalog/blob/b583768ccd0703d1c445075770009089f96ebb14/entries/workflows/repo-retro/SKILL.md
overlap: Retrospective turns lessons from a finished piece of work into durable project guidance. Repo Retro reviews evidence across repository sessions or lessons notes and ranks proposals for the user to decide on. Native harness history provides past turns when available, and manual notes review can suffice when the notes already identify a current fix.
related: [retrospective]
