install:
  notes: Copy the directory, including LICENSE.txt. Use one commit skill at a time; prefer committing-with-commitlint when the repository enforces commitlint and commit-history-hygiene for multi-commit series and fixups.
overlap: Claude Code's built-in git commit instructions already cover commit-only-when-asked, explicit staging, secrets, hooks, no amend after a hook failure and no push. Codex prompts forbid unrequested commits but give no message format. This adds the Conventional Commits format and type table.
