schemaVersion: 2
id: git-commit
type: skill
title: Git commits with Conventional Commits
summary: Reads the repository's commit rules, examines the diff, stages one logical change by explicit path, writes a Conventional Commits message and commits. It avoids interactive staging, checks staged names for secrets, retries hook failures without amending, and never pushes or rewrites history.
useWhen: Asking the agent to commit work in a repository that uses, or should use, Conventional Commits, especially on hosts without a built-in commit procedure.
tags: [commits, git, conventional-commits, conventions]
hosts: [any]
