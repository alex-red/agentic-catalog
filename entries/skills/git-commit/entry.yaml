schemaVersion: 2
id: git-commit
type: skill
title: Git commits with Conventional Commits
summary: Reads the repository's commit rules, examines the diff, stages one logical change by explicit path, writes a Conventional Commits message and commits. It avoids interactive staging, checks staged names for secrets, retries hook failures without amending, and never pushes or rewrites history.
useWhen: Asking the agent to commit work in a repository that uses, or should use, Conventional Commits, especially on hosts without a built-in commit procedure.
tags: [commits, git, conventional-commits, conventions]
hosts: [any]
rating:
  usefulness: 4
  quality: 4
  portability: 5
  novelty: 2
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Complete one-file skill read at the pin. Repository rules take precedence over the skill's own format; Git trailer syntax and the hook-failure rule are stated correctly. `git add --resolved` exists only from Git 2.56, and `git history` is experimental; both were checked against upstream Git documentation and release notes. Splitting is file-level only. It commits once invoked, which fits its explicit trigger. Claude Code's built-in commit procedure covers most of the safety rules, so the main gain there is the message format; Codex has no format guidance.
