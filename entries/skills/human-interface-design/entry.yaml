schemaVersion: 2
id: human-interface-design
type: skill
title: Human-centered interface design
summary: Applies Apple-inspired human-interface principles to task structure, navigation, state, visual hierarchy and accessibility. Adapts to web, mobile, desktop and other surfaces while preserving product identity and established conventions.
useWhen: Designing, implementing, refining or reviewing an interface where task clarity, interaction behavior, recovery or platform fit needs deliberate decisions.
tags: [design, ux, interaction-design, accessibility, cross-platform]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 3
    compatibility: 3
    upkeep: 3
  context: "Developers working on this task: Designing, implementing, refining or reviewing an interface where task clarity, interaction behavior, recovery or platform fit needs deliberate decisions. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: Native design reasoning and frontend-design cover visual execution; interface-design covers product hierarchy and tokens; emil-design-eng covers motion craft. ux-critique and evidence-to-flow-ux cover evidence and criticism; intent covers a broader lifecycle. This adds a compact cross-platform decision method centered on agency, honest states, recovery and platform adaptation. It requires no other entry, tool connection or persistence convention."
  review: docs/reviews/2026-10-29-human-interface-design.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Useful cross-platform decision structure; overlaps existing design skills and is not accessibility certification. Static curator assessment; no new behavioral trial.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
  notes: Original prose and decision method inspired by Apple HIG and supporting platform standards, reviewed October 29, 2026. No Apple prose, artwork, fonts, symbols, code or resources are redistributed. Source pages are mutable; dated WWDC sessions anchor the conceptual basis. Not official or Apple-endorsed.
