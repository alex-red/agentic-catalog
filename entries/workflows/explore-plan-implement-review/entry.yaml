schemaVersion: 2
id: explore-plan-implement-review
type: workflow
title: Explore, plan, implement, review
summary: Explore read-only and write a plan with a check for each step before editing. Implement against the plan, then have a fresh-context reviewer compare the diff with the plan and report only gaps in correctness or requirements.
useWhen: A change spans several files, the approach is uncertain, or the agent will run long enough unattended that it should not grade its own work.
tags: [planning, code-review, verification, subagents]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 2
    dependability: 3
    cognitiveEase: 2
    control: 3
    adoption: 2
    compatibility: 3
    upkeep: 4
  context: "Developers working on this task: A change spans several files, the approach is uncertain, or the agent will run long enough unattended that it should not grade its own work. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: Plan mode, /code-review, and subagents in Claude Code; plan mode and /review in Codex. compound-engineering is the heavyweight version."
  review: docs/reviews/2026-10-29-explore-plan-implement-review.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Use for changes needing coordination; ordinary one-sentence fixes should take its explicit skip path. Static curator assessment; no new behavioral trial.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
inspiredBy:
  - title: Claude Code best practices, explore then plan then code, and adversarial review
    url: https://code.claude.com/docs/en/best-practices
overlap: Plan mode, /code-review, and subagents in Claude Code; plan mode and /review in Codex. compound-engineering is the heavyweight version.
related: [pr-review-code-reviewer, compound-engineering, grilling]
