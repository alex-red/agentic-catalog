schemaVersion: 2
id: monorepo-change-verification
type: workflow
title: Monorepo change verification
summary: Map package, task and release graphs; verify package boundaries and affected consumers; and check prerequisite ordering, cache restoration and invalidation without replacing existing monorepo tooling.
useWhen: Planning or verifying cross-package changes, shared build configuration, affected-task selection or package boundaries in a monorepo.
tags: [monorepo, architecture, dependencies, build-systems, caching, verification, testing]
hosts: [any]
rating:
  usefulness: 4
  quality: 4
  portability: 5
  novelty: 3
  evidence: reviewed
  reviewed: 2026-10-28
  notes: A tool-agnostic workflow that distinguishes dependency, task and release graphs and checks conservative affected selection. Complements repository discovery and general verification. Source reviewed; no representative agent outcome or Turbo/Nx cache evaluation.
source:
  kind: original
  license: MIT
  author: Agentic Catalog contributors
  notes: Independently written from official tool contracts. No upstream skill text, examples, scripts or runtime are copied.
overlap: repo-research discovers conventions and verification-before-completion requires evidence. Native task runners compute graphs and execute checks; agents-md-authoring covers scoped instructions. This workflow handles cross-package selection and package/cache contracts without installing or replacing a runner.
related: [repo-research, verification-before-completion, agents-md-authoring, bun-workspaces]
