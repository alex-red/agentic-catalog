schemaVersion: 2
id: harness-experiment-loop
type: workflow
title: Harness experiment loop
summary: Test changes to agent instructions, skills or helpers on repeatable tasks. Preserve an unchanged baseline, probe focused alternatives, compare execution evidence, rerun a selective composition and retain only supported lessons, with transfer checked separately.
useWhen: Deciding whether a change to agent guidance addresses an observed recurring failure before making that guidance persistent.
tags: [self-improvement, evaluation, project-instructions, skill-authoring, verification]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 4
    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 2
    compatibility: 3
    upkeep: 4
  context: "Developers working on this task: Deciding whether a change to agent guidance addresses an observed recurring failure before making that guidance persistent. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: retrospective identifies lessons and placement; improvement-loop implements process fixes; self-improvement-loop already suggests comparisons. This workflow specifies isolation, candidate hypotheses, execution contrasts, composed replay and baseline retention. Host sessions and evaluation tools supply execution, not evidence that guidance helps. ralph-loop repeats product work toward completion instead of comparing harness changes."
  review: docs/reviews/2026-10-29-harness-experiment-loop.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Strong for guidance maintainers; cost and replayability make it excessive for ordinary product edits. Static curator assessment; no new behavioral trial.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
  notes: Independently written procedure inspired by Google's Apache-2.0 Harness² method. No upstream prose, code, scripts or runtime files are copied. Baseline-output fallback and a separate transfer gate are catalog adaptations.
