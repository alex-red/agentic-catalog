schemaVersion: 2
id: game-balance-review
type: workflow
title: Evidence-backed game balance analysis
summary: Reviews combat, economy, progression and loot against explicit rules, targets and available evidence. Separates missing inputs, structural defects, uncertain acquisition distributions and observed player outcomes.
useWhen: Assessing game balance from formulas, content data, progression requirements, loot rules or telemetry, and proposing bounded tuning experiments.
tags: [game-design, balance, virtual-economies, progression]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 3
    compatibility: 3
    upkeep: 4
  context: "Developers working on this task: Assessing game balance from formulas, content data, progression requirements, loot rules or telemetry, and proposing bounded tuning experiments. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: mmorpg-design examines mechanics and incentives; native analysis can calculate formulas; synthesize-research organizes evidence. This supplies a data-bearing balance review with cohort/condition assumptions and acquisition-tail analysis. It does not replace project targets or require a studio configuration."
  review: docs/reviews/2026-10-29-game-balance-review.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Useful specialist analysis; target ranges and spreadsheets do not establish enjoyable balance. Static curator assessment; no new behavioral trial.
