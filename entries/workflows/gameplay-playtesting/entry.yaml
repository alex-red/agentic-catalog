schemaVersion: 2
id: gameplay-playtesting
type: workflow
title: Gameplay studies and observation workflow
summary: Prepares and interprets focused gameplay tests, keeping implementation checks, design inspection and real-player evidence separate. Connects traceable observations to decisions and comparable retests without a studio runtime.
useWhen: Planning gameplay studies, analyzing playtest notes or recordings, or exercising a playable build to investigate controls, learning, fairness, pacing or cooperation.
tags: [game-design, playtesting, user-research, verification]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 2
    compatibility: 3
    upkeep: 4
  context: "Developers working on this task: Planning gameplay studies, analyzing playtest notes or recordings, or exercising a playable build to investigate controls, learning, fairness, pacing or cooperation. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: moderated-usability-study handles general participant sessions, synthesize-research handles findings and webapp-testing handles browser checks. This is a game-specific route through the needed evidence, including mastery, fairness, repeat loops and controls; it requires none of those entries and does not claim automated play proves human enjoyment."
  review: docs/reviews/2026-10-29-gameplay-playtesting.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Good game-study structure; long-term social and mastery questions need longer observation. Static curator assessment; no new behavioral trial.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
  notes: Independent prose inspired by inspected BMad playtest planning and knowledge guidance. Omits unread template/resolver runtime, arbitrary frequency thresholds, automatic agents and mandatory checkpoints. No upstream text or code copied.
