overlap: moderated-usability-study handles general participant sessions, synthesize-research handles findings and webapp-testing handles browser checks. This is a game-specific route through the needed evidence, including mastery, fairness, repeat loops and controls; it requires none of those entries and does not claim automated play proves human enjoyment.
related: [moderated-usability-study, synthesize-research, webapp-testing, mmorpg-design, game-balance-review, mechanic-prototyping]
