schemaVersion: 2
id: rust-verification-ladder
type: workflow
title: Rust verification ladder
summary: Match a Rust change to appropriate evidence, starting with existing Cargo checks and selectively using Miri, Loom, fuzzing, Kani, mutation testing or API compatibility checks. Record versions, target/features, bounds and limitations instead of treating one passing run as a proof.
useWhen: Choosing or reviewing verification for a Rust change involving unsafe code, concurrency, input handling, test quality or a public library API.
tags: [rust, verification, testing, unsafe-code, concurrency, fuzzing, api-compatibility]
hosts: [any]
