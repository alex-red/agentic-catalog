  rubric: human-v1
  dimensions:
    value: 4
    dependability: 3
    cognitiveEase: 3
    control: 4
    adoption: 3
    compatibility: 3
    upkeep: 3
  context: "Developers working on this task: Choosing or reviewing verification for a Rust change involving unsafe code, concurrency, input handling, test quality or a public library API. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: Cargo, rustfmt, Clippy and project CI supply the actual checks. verification-before-completion requires evidence but does not select Rust-specific layers. property-based-testing and variant-analysis supply adjacent methods; tokio-async-correctness covers runtime lifecycle review. Optional tools are separate prerequisites, not bundled capabilities."
  review: docs/reviews/2026-10-29-rust-verification-ladder.md
  evidence: reviewed
