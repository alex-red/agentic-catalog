schemaVersion: 2
id: evidence-to-flow-ux
type: workflow
title: Evidence-to-flow UX decision workflow
summary: Connects a bounded product decision to task inspection, existing research or participant-study preparation, then a supported design change and proportionate retest. Keeps observations, hypotheses and human evidence distinct without requiring every stage.
useWhen: Moving from a concrete task problem or research uncertainty to a design decision, authorized change and a retest that matches the claim.
tags: [ux, user-research, usability, interaction-design, verification]
hosts: [any]
rating:
  usefulness: 4
  quality: 4
  portability: 5
  novelty: 4
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Bounded, self-contained procedure with branching by evidence, task-state coverage, an evidence ledger and explicit stopping conditions. Browser success remains distinct from human usability; unavailable participants lead to preparation rather than invented results. No full lifecycle ceremony or mandatory tool. Source and structural review only; no measured outcome improvement.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
  notes: Independently written combination of decision framing, observed-versus-inferred task inspection, traceable synthesis and retest. No upstream scripts, forcing loops, numerical scores or source prose copied. Other catalog entries are optional alternatives, not required dependencies.
