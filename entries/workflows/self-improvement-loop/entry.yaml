    control: 3
    adoption: 2
    compatibility: 3
    upkeep: 4
  context: "Developers working on this task: You want the agent to learn from each session and write the lessons back into the project without bloating its instructions. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: Claude Code auto memory captures corrections, but it does not decide where a lesson belongs or prune."
