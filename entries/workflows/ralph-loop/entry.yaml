schemaVersion: 2
id: ralph-loop
type: workflow
title: Ralph loop
summary: Fresh-context iteration against a plan. A shell loop reruns one fixed prompt; each pass picks one task from IMPLEMENTATION_PLAN.md, implements it behind tests, commits, and updates the plan, until a completion token or an iteration cap.
useWhen: You have clear specs and a strong test suite and want long, unattended greenfield or backlog work in a sandbox.
tags: [autonomous-loop, long-running, planning, backpressure]
hosts: [any]
rating:
  rubric: human-v1
  dimensions:
    value: 3
    dependability: 2
    cognitiveEase: 2
    control: 2
    adoption: 2
    compatibility: 2
    upkeep: 3
  context: "Developers working on this task: You have clear specs and a strong test suite and want long, unattended greenfield or backlog work in a sandbox. Declared hosts: any."
  baseline: "Comparison baseline and alternatives: Claude Code /goal and /loop, Codex /goal, and the ralph-loop plugin for Claude Code."
  review: docs/reviews/2026-10-29-ralph-loop.md
  evidence: reviewed
  reviewed: 2026-10-29
  notes: Only for explicitly authorized sandboxed iteration with strong checks; no whole-loop outcome claim. Static curator assessment; no new behavioral trial.
source:
  kind: adapted
  license: MIT
  author: Agentic Catalog contributors
