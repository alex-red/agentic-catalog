    url: https://ghuntley.com/ralph/
  - title: Clayton Farr, The Ralph Playbook (MIT)
    url: https://github.com/ClaytonFarr/ralph-playbook/blob/8f58cace8a8e4f4fbbf74b09653b500a2b7f4d6e/README.md
  - title: Anthropic ralph-loop plugin, Stop-hook variant (Apache-2.0)
    url: https://github.com/anthropics/claude-plugins-official/tree/986deab6a1659ebb998b66962df6f02b20bb884d/plugins/ralph-loop
overlap: Claude Code /goal and /loop, Codex /goal, and the ralph-loop plugin for Claude Code.
related: [stop-gate-checks, explore-plan-implement-review]
