title: Revise CLAUDE.md with session learnings
summary: An official end-of-session command. It reflects on the context the agent lacked (commands, patterns, gotchas), picks the right CLAUDE.md, drafts one-line additions as diffs with a reason for each, and applies only the ones you approve.
useWhen: A session showed context the agent was missing, and you want a lightweight, approval-gated write-back to project instructions.
