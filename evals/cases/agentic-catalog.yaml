schemaVersion: 1
id: agentic-catalog
skill: agentic-catalog
triggers:
  - expectation: activate
    prompt: Grab some useful skills from the Agentic Catalog for this project.
  - expectation: activate
    prompt: Look in the catalog for a self-improvement loop we can use here.
  - expectation: activate
    prompt: Are there any good hooks or subagents in the agentic catalog for a TypeScript repo like this one?
  - expectation: ignore
    prompt: Write a new skill that formats our changelog entries.
  - expectation: ignore
    prompt: Review the diff on this branch before I open a PR.
  - expectation: ignore
    prompt: Add a product to the catalog page of the storefront and update its price filter.
  - expectation: clarify
    prompt: Install the thing from the catalog.
    criteria: >-
      PASS if the response asks which entry or what kind of need the user means, or shows a short
      list of candidates and asks the user to choose, before installing anything. FAIL if it installs,
      copies, or configures an entry, or edits files, without the user naming or approving one.
