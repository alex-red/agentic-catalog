# Controlled tag vocabulary. Every entry tag must be registered here; every term must be used.
# Facets: topic (what area?), task (what job?), technology (what specific tool or stack?),
# keyword (search-only specialist or hook-event term). Aliases are equivalent wording for lookup;
# they never rename stored IDs. Type, hosts, provenance and evidence stay in their own entry fields.
schemaVersion: 1
terms:
  # Topics
  - id: accessibility
    label: Accessibility
    facet: topic
    aliases: [a11y]
    definition: Making interfaces, documents or games usable with assistive technology, keyboard input and varied perception.
  - id: architecture
    label: Software architecture
    facet: topic
    definition: Structure of code, components, packages or systems and the boundaries between them.
  - id: context
    label: Agent context
    facet: topic
    aliases: [context-hygiene, context window]
    definition: What enters the agent's context window, its cost and what survives compaction or session boundaries.
  - id: design
    label: Design
    facet: topic
    definition: Visual and interface design of products and screens. Broader than visual-design; distinct from ux and frontend implementation.
  - id: dev-ux
    label: Dev UX
    facet: topic
    aliases: [developer experience, devex, dx]
    definition: The local development loop around agents, for the agent or the person - running, finding and observing apps (dev servers, ports, logs, browser checks), toolchains, worktrees and session visibility. Drives the Dev UX browser category.
  - id: frontend
    label: Frontend
    facet: topic
    definition: Building or reviewing web user interfaces in code. Distinct from design and ux, which may not involve implementation.
  - id: game-design
    label: Game design
    facet: topic
    definition: Designing, prototyping and evaluating gameplay, levels, systems and player experience. Drives the Game design browser category.
  - id: memory
    label: Persistent memory
    facet: topic
    aliases: [knowledge-capture]
    definition: Persisting lessons, corrections or session state so later sessions can use them.
  - id: privacy
    label: Privacy
    facet: topic
    definition: Keeping personal data out of prompts, context or outputs.
  - id: project-instructions
    label: Project instructions
    facet: topic
    aliases: [claude-md]
    definition: Always-loaded agent guidance such as AGENTS.md and CLAUDE.md, and the rules for writing or revising it.
  - id: reverse_engineering
    label: Reverse engineering
    facet: topic
    aliases: [reverse-engineering, reverse engineering]
    definition: Recovering behavior and structure from existing software or hardware artifacts. Underscore spelling preserved per decision 44.
  - id: security
    label: Security
    facet: topic
    aliases: [appsec]
    definition: Protecting systems, credentials and agent configuration from misuse or exposure.
  - id: self-improvement
    label: Self-improvement
    facet: topic
    definition: Turning session experience into durable changes to instructions, skills, tooling or checks.
  - id: system-design
    label: System design
    facet: topic
    definition: Designing models, vocabularies and structures that a system is built on. Drives the System design browser category.
  - id: ux
    label: User experience
    facet: topic
    aliases: [user experience]
    definition: How people accomplish tasks through a product, studied through flows, evidence and usability. Distinct from visual design.

  # Tasks
  - id: code-review
    label: Code review
    facet: task
    aliases: [code review]
    definition: Inspecting code or a diff for actionable defects and maintainability concerns.
  - id: debugging
    label: Debugging
    facet: task
    aliases: [diagnosis]
    definition: Finding and fixing the cause of a failure.
  - id: design-review
    label: Design review
    facet: task
    aliases: [critique, design critique]
    definition: Critiquing an interface or flow against design and usability expectations. Not plan or architecture review.
  - id: documentation
    label: Documentation
    facet: task
    definition: Writing, maintaining or retrieving documentation.
  - id: evaluation
    label: Agent evaluation
    facet: task
    aliases: [evals]
    definition: Measuring agent, skill or tool behavior on repeatable cases. Distinct from software testing.
  - id: guardrails
    label: Guardrails
    facet: task
    aliases: [safety]
    definition: Blocking or gating risky agent actions before they take effect.
  - id: planning
    label: Planning
    facet: task
    definition: Producing or stress-testing a plan before implementation.
  - id: refactoring
    label: Refactoring
    facet: task
    definition: Restructuring existing code without changing its intended behavior.
  - id: research
    label: Technical research
    facet: task
    definition: Investigating a codebase, its sources and technical options. Studies of people use user-research.
  - id: retrospective
    label: Retrospective
    facet: task
    definition: Reviewing finished work to find what slowed it down.
  - id: scope
    label: Scope control
    facet: task
    definition: Keeping changes and actions within what the request and authorization cover.
  - id: testing
    label: Testing
    facet: task
    definition: Writing, running or protecting automated tests. Broader than tdd; narrower than verification.
  - id: user-research
    label: User research
    facet: task
    aliases: [user research, ux research]
    definition: Studying real people through interviews, usability sessions, playtests or feedback synthesis.
  - id: verification
    label: Verification
    facet: task
    definition: Producing evidence that a change works where its effect appears, including tests, checks and running the app.

